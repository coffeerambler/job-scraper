name: Taiwan job scrape

on:
  schedule:
    # GitHub Actions cron is UTC. 06:00 UTC = 07:00 UK during BST.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  taiwan_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape Taiwan sources and insert new jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scrapers.taiwan_scraper

      - name: Score Taiwan jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python score_jobs.py taiwan

      - name: Notify Discord (Taiwan)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_TAIWAN: ${{ secrets.DISCORD_WEBHOOK_TAIWAN }}
        run: python notify_discord.py taiwan
